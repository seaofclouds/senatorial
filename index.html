<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senatorial</title>

<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  :root {
    --body: hsl(30, 5%, 30%);
    --well: hsl(18, 4%, 19%);
    --key: hsl(38, 1%, 45%);
    --key-active: hsl(18, 2%, 56%);
    --key-text: hsl(22, 5%, 24%);
    --engraving: hsl(38, 2%, 43%);
    --caret: hsl(0, 80%, 45%);
  }

  html { height: 100%; }

  body {
    display: grid;
    place-items: end center;
    min-height: 100%;
    margin: 0;
    font-family: system-ui;
    background: hsl(40 20% 90%);
  }

  section {
    position: relative;
    width: 100%;
    max-width: 72em;
    padding: 1.5em .5em;
    opacity: 0;
    transition: opacity .3s;
    body.ready & { opacity: 1; }
  }

  /* PAPER ******************************************************************************************/

  .pages {
    position: relative;
    display: flex;
    flex-flow: column;
    align-items: center;
    gap: 1.5em;
    padding-bottom: 1.5em;
  }

  .page {
    position: relative;
    background: white;
    box-shadow: 0 .5px 1px #0001;
    cursor: text;
    canvas { display: block; width: 100%; height: 100%; }
  }

  /* Margin guides only appear while you're setting the stops */
  .guide {
    position: absolute;
    border: 1px dashed hsla(0, 70%, 45%, .3);
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
    body.guides & { opacity: 1; }
  }

  .selection {
    position: absolute;
    inset: 0;
    pointer-events: none;
    div { position: absolute; background: hsla(30, 5%, 30%, .18); }
  }

  .caret {
    position: absolute;
    width: 2px;
    background: var(--caret);
    pointer-events: none;
    scroll-margin: 2em 0 10em;
    animation: blink 1.1s steps(1) infinite;
    body:not(.focused) & { opacity: 0; animation: none; }
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* The real input lives here, invisible, parked at the caret so IMEs and mobile keyboards behave */
  .input {
    position: absolute;
    width: 1px;
    padding: 0;
    border: 0;
    margin: 0;
    font-size: 16px; /* stops iOS from zooming on focus */
    opacity: 0;
    resize: none;
    overflow: hidden;
    white-space: pre;
    caret-color: transparent;
    pointer-events: none;
    outline: none;
  }

  /* MACHINE ****************************************************************************************/

  .ui {
    position: sticky;
    bottom: 2em;
    z-index: 1;
    display: flex;
    flex-flow: column;
    gap: 1.6em;
    padding: 0 1.5em 1.5em;
    border-radius: 1em;
    background: var(--body);
  }

  .scale {
    position: relative;
    margin: 0 auto;
    height: 40px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: copy;
    canvas { display: block; width: 100%; height: 100%; }
  }

  /* Margin stops: dark pills engraved with their setting, like the old number boxes */
  .pill {
    position: absolute;
    top: calc(100% - .5em);
    translate: -50%;
    min-width: 2.2em;
    padding: 0 .35em;
    border-radius: .2em;
    font-size: 1rem;
    line-height: 1.4;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--engraving);
    background: var(--well);
    cursor: ew-resize;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    &:hover, &.dragging { color: hsl(38, 4%, 62%); }
  }

  /* Top & bottom margin stops ride along the left edge of each sheet */
  .vstop.pill {
    top: auto;
    right: 100%;
    margin-right: .5em;
    translate: 0 -50%;
    cursor: ns-resize;
    opacity: .4;
    transition: opacity .2s;
    .page:hover &, body.guides & { opacity: 1; }
  }

  .tab {
    position: absolute;
    top: 0;
    width: 12px;
    height: 22px;
    translate: -50%;
    cursor: ew-resize;
    &::before {
      content: '';
      position: absolute;
      inset: 0 4px 6px;
      border-radius: 0 0 3px 3px;
      background: var(--well);
    }
    &.removing { opacity: .3; }
  }

  /* Shows where the next letter will strike, like the carriage pointer */
  .pointer {
    position: absolute;
    top: 0;
    width: 2px;
    height: 100%;
    translate: -1px;
    background: hsl(0, 70%, 45%);
    border-radius: 0 0 2px 2px;
    pointer-events: none;
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1em;
  }

  .spacer { margin-right: auto !important; }

  button {
    border: none;
    border-radius: 1em;
    font: inherit;
    font-size: 1rem;
    line-height: 1.5;
    padding: 0 .7em;
    color: var(--key-text);
    background: var(--key);
    cursor: pointer;
    appearance: none;
    white-space: nowrap;
  }

  button.active {
    background: var(--key-active);
  }

  .toggle {
    position: relative;
    box-sizing: content-box;
    width: 40px;
    height: 20px;
    margin: 0;
    border: 4px solid hsl(18, 2%, 42%);
    border-radius: 24px;
    background: hsl(28, 3%, 14%);
    box-shadow: 0 0 0 2px #0003 inset;
    transition: background-color .1s;
    will-change: background-color;
    appearance: none;
    cursor: pointer;

    &:checked {
      background: hsl(0, 59%, 27%);
    }

    &:after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 10px;
      background: hsl(28, 1%, 48%);
      transition: left .1s, background-color .1s;
      will-change: left, background-color;
      pointer-events: none;
    }

    &:checked:after {
      left: calc(100% - 16px - 2px);
      background: hsl(360, 100%, 40%);
    }
  }

  /* Paper tray — pops up out of the machine */
  .tray {
    position: absolute;
    bottom: calc(100% + .75em);
    right: 0;
    display: flex;
    flex-flow: column;
    gap: .75em;
    width: min(27em, 100%);
    padding: 1em;
    border-radius: 1em;
    background: var(--body);
    box-shadow: 0 6px 20px #0003;
    .keys { display: flex; flex-wrap: wrap; gap: .5em; }
  }

  .size {
    display: flex;
    align-items: center;
    gap: .5em;
    color: var(--engraving);
  }

  [type=number] {
    font: inherit;
    width: 4em;
    border: 0;
    border-radius: .2em;
    text-align: center;
    color: var(--engraving);
    background: var(--well);
    -moz-appearance: textfield;
    &::-webkit-outer-spin-button,
    &::-webkit-inner-spin-button { margin: 0; -webkit-appearance: none; }
    &:focus { outline: 2px solid hsl(28, 1%, 45%); }
  }

  /* PRINT — each page is a pre-rendered image sized to the physical sheet */

  .print { display: none; }

  @media print {
    body { display: block; background: none; }
    section { display: none; }
    .print { display: block; }
    .print img { display: block; break-after: page; }
  }

  @media (max-width: 700px) {
    .ui { bottom: .5em; padding: 0 .75em .75em; gap: 1.4em; }
    .buttons { gap: .5em; }
    .vstop.pill { margin-right: .1em; font-size: .8rem; min-width: 1.8em; }
  }
</style>

<section>
  <div class="pages">
    <div class="selection"></div>
    <div class="caret"></div>
    <textarea class="input" autofocus spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
  </div>
  <div class="ui">
    <div class="scale"><canvas></canvas><div class="pointer"></div></div>
    <div class="buttons">
      <button id="regular" class="active">Regular</button>
      <button id="light">Light</button>
      <button id="double">Double Struck</button>
      <input type="checkbox" id="red" class="toggle spacer" role="switch" title="Red ribbon">
      <button id="paper" title="Paper">Letter</button>
      <button id="spacing" title="Line spacing">Single</button>
      <button id="clearTabs" title="Clear all tab stops">Tab Clear</button>
      <button id="reset">Reset</button>
      <button id="download">Save</button>
      <button id="print">Print</button>
    </div>
    <div class="tray" hidden>
      <div class="keys" id="papers"></div>
      <div class="keys">
        <button id="portrait">Portrait</button>
        <button id="landscape">Landscape</button>
      </div>
      <label class="size" id="customSize"><input id="customW" type="number" step="0.25" min="1" max="30"> × <input id="customH" type="number" step="0.25" min="1" max="30"> inches</label>
    </div>
  </div>
</section>

<div class="print"></div>

<script type="text/coffeescript" src="index.coffee"></script>
<script src="coffeescript.js"></script>
