<!doctype html>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senatorial</title>
<meta name="description" content="Type on true-to-size sheets of paper with a real Senatorial typewriter face.">
<meta name="theme-color" content="hsl(40 20% 90%)">

<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  :root {
    --body: hsl(30, 5%, 30%);
    --well: hsl(18, 4%, 19%);
    --key: hsl(38, 1%, 45%);
    --key-active: hsl(18, 2%, 56%);
    --key-text: hsl(22, 5%, 24%);
    --engraving: hsl(38, 2%, 43%);
    --caret: hsl(0, 80%, 45%);
  }

  /* A full-size sheet is often wider than the screen. Clip it rather than letting the page zoom out to fit. */
  html { height: 100%; overflow-x: clip; }

  body {
    display: grid;
    place-items: end center;
    min-height: 100%;
    margin: 0;
    font-family: system-ui;
    background: hsl(40 20% 90%);
    overflow-x: clip;
    grid-template-columns: minmax(0, 1fr); /* Don't let a wide sheet stretch the machine past the screen */
  }

  section {
    position: relative;
    width: 100%;
    max-width: 72em;
    padding: 1.5em .5em;
    overflow-x: clip;
    opacity: 0;
    transition: opacity .3s;
    body.ready & { opacity: 1; }
  }

  /* PAPER ******************************************************************************************/

  /* Sheets are actual size. The whole stack slides sideways with the carriage when it's wider than the screen. */
  .pages {
    position: relative;
    display: flex;
    flex-flow: column;
    align-items: flex-start;
    gap: 4em;
    padding: 3.5em 0 1.5em;
    transition: translate .2s ease-out;
    touch-action: pan-y pinch-zoom; /* Sideways swipes slide the sheet; this also stops double-tap zooming */
    &.sliding { transition: none; }
  }

  .page {
    position: relative;
    background: white;
    box-shadow: 0 .5px 1px #0001;
    cursor: text;
    canvas { display: block; width: 100%; height: 100%; }
  }

  /* Margin guides only appear while you're setting the stops */
  .guide {
    position: absolute;
    border: 1px dashed hsla(0, 70%, 45%, .3);
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
    body.guides & { opacity: 1; }
  }

  .selection {
    position: absolute;
    inset: 0;
    pointer-events: none;
    div { position: absolute; background: hsla(30, 5%, 30%, .18); }
  }

  .caret {
    position: absolute;
    width: 2px;
    background: var(--caret);
    pointer-events: none;
    scroll-margin: 2em 0 10em;
    animation: blink 1.1s steps(1) infinite;
    body:not(.focused) & { opacity: 0; animation: none; }
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* The real input lives here, invisible, parked at the caret so IMEs and mobile keyboards behave */
  .input {
    position: absolute;
    width: 1px;
    padding: 0;
    border: 0;
    margin: 0;
    font-size: 16px; /* stops iOS from zooming on focus */
    opacity: 0;
    resize: none;
    overflow: hidden;
    white-space: pre;
    caret-color: transparent;
    pointer-events: none;
    outline: none;
  }

  /* MACHINE ****************************************************************************************/

  /* The machine stays put at the foot of the screen, with room kept under the sheets so the last one can be typed on */
  .ui {
    position: fixed;
    left: 50%;
    bottom: 2em;
    z-index: 1;
    width: calc(min(100%, 72em) - 1em);
    translate: -50% 0;
    display: flex;
    flex-flow: column;
    padding: 1em 1.5em;
    border-radius: 1em;
    background: var(--body);
  }

  .saved { font-size: .85rem; color: hsl(38, 4%, 62%); }

  body:not(.viewing) section { padding-bottom: calc(var(--deck-height, 4em) + 3.5em); }

  /* Save is the machine's last key */
  .edit-key { background: var(--key-active); }

  /* READING — a page's link shows just the page, in the middle of the screen (or from the top, when it's taller).
     The machine is put away, all but its last key, which reads Edit, right where Save was. */
  body.viewing {
    place-items: center;
    .ui { visibility: hidden; }
    .pages { padding: 1.5em 0; }
    .edit-key {
      visibility: visible;
      color: hsl(38, 6%, 88%);
      background: var(--body);
      box-shadow: 0 4px 14px #0003;
    }
  }

  /* MARGIN & TAB STOPS — light tabs, rounded on the outside, pointing at exactly where each margin falls */

  /* They stay out of sight until you come near the edge of the sheet: the strip above it, or the margin to its left */
  .edge {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 100%;
    width: 72px;
  }

  .strip > *, .page > .flag, .page > .lever.spacing {
    visibility: hidden;
    filter: opacity(0);
    transition: filter .25s, opacity .15s, visibility 0s .25s;
  }

  .page.tools {
    .strip > *, > .flag, > .lever.spacing {
      visibility: visible;
      filter: none;
      transition: filter .25s, opacity .15s;
    }
  }

  /* The strip along the top of each sheet holds the left & right margins, tab stops, and centre mark */
  .strip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    height: 44px;
    cursor: copy;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .flag {
    --tab: hsl(36, 10%, 82%);
    position: absolute;
    display: flex;
    flex-flow: column;
    align-items: center;
    gap: 1px;
    width: 22px;
    padding: 4px 0 3px;
    font-size: 11px;
    line-height: 12px;
    font-variant-numeric: tabular-nums;
    color: hsl(30, 5%, 46%);
    background: var(--tab);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    opacity: .7;
    transition: opacity .15s;
    &:hover, &.dragging { opacity: 1; --tab: hsl(36, 10%, 77%); }
    body.guides & { opacity: 1; }

    /* The point */
    &::after {
      content: '';
      position: absolute;
      background: var(--tab);
    }
  }

  /* Left & right margin tabs hang above the sheet, pointing down at the margin */
  .flag.down {
    bottom: 7px;
    translate: -50%;
    border-radius: 11px 11px 2px 2px;
    cursor: ew-resize;
    &::after { top: 100%; left: 0; right: 0; height: 6px; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  }

  /* Top & bottom margin tabs sit off the left edge, pointing right at the margin —
     the same shape as the left & right tabs turned on their side, with the link beside the number */
  .flag.across {
    right: 100%;
    margin-right: 7px;
    flex-flow: row;
    width: auto;
    min-width: 34px;
    height: 22px;
    padding: 0 4px 0 5px;
    translate: 0 -50%;
    border-radius: 11px 2px 2px 11px;
    cursor: ns-resize;
    &::after { left: 100%; top: 0; bottom: 0; width: 6px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  }

  /* Links a margin to the one opposite, so they move together */
  .link {
    display: block;
    width: 14px;
    height: 14px;
    color: hsl(30, 5%, 62%);
    cursor: pointer;
    &.linked { color: hsl(30, 5%, 30%); }
    &:hover { color: hsl(30, 5%, 22%); }
    svg { display: block; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  }

  .tabstop {
    position: absolute;
    bottom: 1px;
    width: 11px;
    height: 9px;
    translate: -50%;
    background: hsl(36, 8%, 66%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    cursor: ew-resize;
    &:hover, &.dragging { background: hsl(30, 6%, 50%); }
    &.removing { opacity: .25; }
  }

  /* The centre of the sheet, for lining things up by eye */
  .center-mark {
    position: absolute;
    bottom: 0;
    width: 2px;
    height: 9px;
    translate: -1px;
    border-radius: 1px 1px 0 0;
    background: hsl(36, 8%, 66%);
    pointer-events: none;
  }

  /* FORMAT MENU — pops up over a selection */
  .format {
    position: absolute;
    z-index: 1;
    display: flex;
    flex-flow: column;
    gap: .4em;
    padding: .4em;
    border-radius: 1em;
    background: var(--body);
    box-shadow: 0 4px 14px #0003;
    white-space: nowrap;
    max-width: calc(100vw - 32px);

    /* How it's struck on the first row, with the ribbon colour at the end; what's struck over it on the second,
       with the alignment */
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: .4em; }
    .row > :last-child { margin-left: auto; }

    button { font-size: .9rem; }
    .lever button { height: 1.35rem; }
    .light { font-weight: 300; }
    .double { font-weight: 700; }
    .caps { letter-spacing: .06em; text-transform: uppercase; font-size: .8rem; }
    .underline { text-decoration: underline; text-underline-offset: 2px; }
    .strike { text-decoration: line-through; }

    .red {
      width: 1.5em;
      height: 1.5em;
      padding: 0;
      border-radius: 50%;
      background: hsl(0, 45%, 32%);
      &.active { background: hsl(360, 100%, 40%); box-shadow: 0 0 0 2px hsl(18, 2%, 56%); }
    }
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1em;
  }

  .spacer { margin-right: auto !important; }

  button {
    border: none;
    border-radius: 1em;
    font: inherit;
    font-size: 1rem;
    line-height: 1.5;
    padding: 0 .7em;
    color: var(--key-text);
    background: var(--key);
    cursor: pointer;
    appearance: none;
    white-space: nowrap;
  }

  button.active {
    background: var(--key-active);
  }

  .toggle {
    position: relative;
    box-sizing: content-box;
    width: 40px;
    height: 20px;
    margin: 0;
    border: 4px solid hsl(18, 2%, 42%);
    border-radius: 24px;
    background: hsl(28, 3%, 14%);
    box-shadow: 0 0 0 2px #0003 inset;
    transition: background-color .1s;
    will-change: background-color;
    appearance: none;
    cursor: pointer;

    &:checked {
      background: hsl(0, 59%, 27%);
    }

    &:after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 10px;
      background: hsl(28, 1%, 48%);
      transition: left .1s, background-color .1s;
      will-change: left, background-color;
      pointer-events: none;
    }

    &:checked:after {
      left: calc(100% - 16px - 2px);
      background: hsl(360, 100%, 40%);
    }
  }

  /* Line space lever, after the Olympia SM9 */
  /* A lever is a plain pill with its settings engraved on it, the one it's set to inked in */
  .lever {
    display: flex;
    align-items: center;
    padding: 0 5px;
    border-radius: 1em;
    background: var(--key);

    button {
      width: 24px;
      height: 1.5rem;
      padding: 0;
      border-radius: 0;
      background: none;
    }

    svg {
      display: block;
      width: 18px;
      height: 18px;
      margin: auto;
      stroke: hsl(38, 2%, 62%);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    button.active svg { stroke: var(--key-text); }
  }

  /* On the sheet, the line space lever stands upright along the left edge, under the top margin tab,
     the same width as the tabs */
  .lever.spacing {
    position: absolute;
    right: 100%;
    margin-right: 7px;
    flex-flow: column;
    width: 22px;
    padding: 6px 0;
    border-radius: 11px;
    background: hsl(36, 10%, 82%);
    opacity: .7;
    transition: opacity .15s;
    &:hover { opacity: 1; }

    button { width: 22px; height: 18px; }
    svg { width: 16px; height: 18px; stroke: hsl(30, 5%, 64%); }
    button.active svg { stroke: hsl(30, 5%, 30%); }
  }

  /* Paper chooser — every kind of sheet laid out on the desk */
  .chooser {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-flow: column;
    gap: 2em;
    padding: 2.5em 1.5em;
    overflow: auto;
    background: hsl(40 20% 90%);

    .orientation {
      display: flex;
      justify-content: center;
      gap: 1.5em;
    }

    .orientation button {
      padding: 0;
      font-size: .9rem;
      color: hsl(30, 5%, 62%);
      background: none;
      &.active { color: hsl(30, 5%, 30%); }
    }

    .sheets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 2em;
      margin: auto 0;
    }
  }

  body.choosing { overflow: hidden; }

  .sheet {
    position: relative;
    flex: none;
    display: flex;
    flex-flow: column;
    align-items: flex-end;
    padding: .5em .6em;
    background: white;
    box-shadow: 0 .5px 1px #0001;
    cursor: pointer;
    transition: translate .15s, box-shadow .15s;
    &:hover { translate: 0 -3px; box-shadow: 0 4px 12px #0002; }
    &.active { box-shadow: 0 0 0 2px hsl(30, 5%, 55%); }

    .name { font-size: .8rem; color: hsl(30, 5%, 45%); }
    .dims { font-size: .7rem; color: hsl(30, 5%, 70%); }

    .custom {
      margin: auto;
      display: flex;
      align-items: center;
      gap: .3em;
      font-size: .8rem;
      color: hsl(30, 5%, 70%);
    }

    [type=number] {
      width: 3em;
      color: hsl(30, 5%, 40%);
      background: hsl(40 20% 94%);
    }
    .keep {
      align-self: center;
      margin-bottom: .2em;
      padding: 0 .6em;
      font-size: .75rem;
      color: hsl(30, 5%, 40%);
      background: hsl(40 20% 94%);
    }

    .forget {
      position: absolute;
      top: .25em;
      left: .4em;
      padding: 0;
      font-size: .9rem;
      line-height: 1;
      color: hsl(30, 5%, 75%);
      background: none;
      &:hover { color: hsl(30, 5%, 40%); }
    }
  }

  [type=number] {
    font: inherit;
    width: 4em;
    border: 0;
    border-radius: .2em;
    text-align: center;
    color: var(--engraving);
    background: var(--well);
    -moz-appearance: textfield;
    &::-webkit-outer-spin-button,
    &::-webkit-inner-spin-button { margin: 0; -webkit-appearance: none; }
    &:focus { outline: 2px solid hsl(28, 1%, 45%); }
  }

  /* PRINT — each page is a pre-rendered image sized to the physical sheet */

  .print { display: none; }

  @media print {
    body { display: block; background: none; }
    section { display: none; }
    .print { display: block; }
    .print .leaf { position: relative; break-inside: avoid; }
    .print .leaf:not(:last-child) { break-after: page; }
    .print img { display: block; width: 100%; height: 100%; }
    .print .trim { display: none; position: absolute; }
    .print .trim.across { width: .25in; margin-top: -.25pt; border-top: .5pt solid black; }
    .print .trim.down { height: .25in; margin-left: -.25pt; border-left: .5pt solid black; }
  }

  @media (max-width: 700px) {
    .ui { bottom: .5em; padding: .75em; }
    .chooser { padding: 1.5em 1em; .sheets { gap: 1.2em; } }
    .buttons { gap: .5em; }
  }
</style>

<section>
  <div class="pages">
    <div class="selection"></div>
    <div class="caret"></div>
    <div class="format" hidden>
      <div class="row">
        <button data-weight="regular">Regular</button>
        <button data-weight="light" class="light">Light</button>
        <button data-weight="double" class="double">Double Struck</button>
        <button data-caps class="caps" title="Capitals — typed over the letters, like shift lock">Caps</button>
        <button data-toggle="red" class="red" title="Red ribbon"></button>
      </div>
      <div class="row">
        <button data-toggle="underline" class="underline" title="Underline — an underscore struck over each letter">Underline</button>
        <button data-toggle="strike" class="strike" title="Strike through — a hyphen struck over each letter">Strike</button>
        <button data-toggle="xout" class="xout" title="X out — an X struck over each letter">X-out</button>
      </div>
    </div>
    <textarea class="input" autofocus spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
  </div>
  <div class="ui">
    <div class="buttons">
      <button id="paper" title="Paper">Letter</button>
      <span class="saved"></span>
      <button id="new" title="Feed in a fresh page, at a new link">New</button>
      <button id="import" title="Open a Markdown or text file in place of this page">Import Markdown</button>
      <input type="file" id="importFile" accept=".md,.markdown,.txt,text/markdown,text/x-markdown,text/plain" hidden>
      <button id="download" title="Each page as a 600 dpi picture">Export PNG</button>
      <button id="export" title="The text, as a Markdown file">Export Markdown</button>
      <button id="print" title="Print each sheet on paper of its own size">Print</button>
      <button class="edit-key" hidden>Save</button>
    </div>
  </div>
</section>

<div class="chooser" hidden>
  <div class="orientation">
    <button data-landscape="false">Portrait</button>
    <button data-landscape="true">Landscape</button>
  </div>
  <div class="sheets"></div>
</div>

<div class="print"></div>

<script type="text/coffeescript" src="index.coffee"></script>
<script src="coffeescript.js"></script>
